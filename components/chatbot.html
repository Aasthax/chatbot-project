<!DOCTYPE html>
<html>
    <head>
        <title>Chatbot</title>
    </head>
    <body>
        <div class="js-container"></div>
        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
        <script type="text/babel">
            const container = document.querySelector('.js-container');
            const root = ReactDOM.createRoot(container);

            function CreateInput({chatMessages, setChatMessages}) {
                const [inputText, setInputText] = React.useState('');

                function SaveInputText(event) {
                    setInputText(event.target.value);
                }

                function sendMessage() {
                    const newChatMessages = [
                        ...chatMessages,
                        {
                        message: inputText,
                        sender: "user",
                        key: crypto.randomUUID()
                        }
                    ]
                    setChatMessages(newChatMessages);

                    const response = Chatbot.getResponse(inputText);

                    setChatMessages([
                        ...newChatMessages,
                        {
                        message: response,
                        sender: "robot",
                        key: crypto.randomUUID()
                        }
                    ])
                    setInputText('');
                }

                return (
                    <>
                        <input 
                            placeholder="Send a message to chatbot" 
                            size="30" 
                            onChange={SaveInputText}
                            value={inputText}
                        />
                        <button onClick={sendMessage}>Send</button>
                    </>
                )
            }

            function CreateMessage(props) {
                const {message, sender} = props;
                return (
                    <>
                        <div>
                            {sender==='robot'? <img src={`../assets/${sender}.png`} width="30px" /> : ''}
                            {message}
                            {sender==='user'? <img src={`../assets/${sender}.png`} width="30px" />: ''}
                        </div>
                    </>
                )
            }

            function CreateMessages({chatMessages}) {
                return (
                    <>
                        {chatMessages.map((chatMessage) => {
                            return (
                                <CreateMessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.key} />
                            )
                        })}
                    </>
                )
            }

            function App() {
                const [chatMessages, setChatMessages] = React.useState([
                    {
                        message: "hello chatbot",
                        sender: "user",
                        key: "id1"
                    },
                    {
                        message: "How can I help you?",
                        sender: "robot",
                        key: "id2"
                    },
                    {
                        message: "can you send me today's date?",
                        sender: "user",
                        key: "id3"
                    },
                    {
                        message: "Today is September 27",
                        sender: "robot",
                        key: "id4"
                    },
                ]);

                return (
                    <>
                        <CreateInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
                        <CreateMessages chatMessages={chatMessages} />
                    </>
                )
            }

            root.render(<App />);
        </script>
    </body>
</html>
